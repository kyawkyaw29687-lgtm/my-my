<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Do I Have A Chance?</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #ffb6c1; /* ပန်းရောင် Background */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }

        .container {
            text-align: center;
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            transition: all 0.3s ease;
            width: 300px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            color: #333;
            font-size: 1.8rem;
            margin: 0 0 15px 0;
        }

        .avatar-box {
            width: 150px;
            height: 150px;
            margin-bottom: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .buttons {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            width: 100%;
            height: 100px; /* ခလုတ်တွေ လွတ်လွတ်လပ်လပ် ကြီးဖို့ နေရာချန်ထားတာ */
        }

        button {
            padding: 12px 25px;
            font-size: 1.2rem;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.1s ease;
        }

        #yesBtn {
            background-color: #4cd137; /* အစိမ်းရောင် ခလုတ် */
            color: white;
            position: relative;
            z-index: 999;
        }

        #noBtn {
            background-color: #e84118; /* အနီရောင် ခလုတ် */
            color: white;
            position: relative;
        }
    </style>
</head>
<body>

    <div class="container" id="card">
        <h1 id="question">Do i have a chance?</h1>
        
        <div class="avatar-box" id="avatarContainer">
            <svg id="cuteAvatar" viewBox="0 0 100 100" width="100%" height="100%">
                <ellipse cx="40" cy="88" rx="6" ry="4" fill="#f0f0f0" stroke="#333" stroke-width="2.5"/>
                <ellipse cx="60" cy="88" rx="6" ry="4" fill="#f0f0f0" stroke="#333" stroke-width="2.5"/>
                <path d="M 35,65 Q 35,90 50,90 Q 65,90 65,65 Z" fill="#fff" stroke="#333" stroke-width="2.5"/>
                <ellipse cx="28" cy="70" rx="5" ry="7" fill="#fff" stroke="#333" stroke-width="2.5" transform="rotate(-15 28 70)"/>
                <ellipse cx="72" cy="70" rx="5" ry="7" fill="#fff" stroke="#333" stroke-width="2.5" transform="rotate(15 72 70)"/>
                <circle cx="50" cy="45" r="30" fill="#fff" stroke="#333" stroke-width="2.5"/>
                <circle cx="28" cy="55" r="4" fill="#ffb6c1"/>
                <circle cx="72" cy="55" r="4" fill="#ffb6c1"/>
                <path d="M 32,48 Q 37,43 42,48" fill="none" stroke="#333" stroke-width="3" stroke-linecap="round"/>
                <path d="M 58,48 Q 63,43 68,48" fill="none" stroke="#333" stroke-width="3" stroke-linecap="round"/>
                <path d="M 47,56 Q 50,53 53,56" fill="none" stroke="#333" stroke-width="2.5" stroke-linecap="round"/>
                <path d="M 50,15 Q 48,8 43,10 Q 48,12 50,15" fill="#4cd137" stroke="#333" stroke-width="1.5"/>
            </svg>
        </div> 
        
        <div class="buttons">
            <button id="yesBtn">Yes</button>
            <button id="noBtn">No</button>
        </div>
    </div>

    <script>
        const yesBtn = document.getElementById('yesBtn');
        const noBtn = document.getElementById('noBtn');
        const card = document.getElementById('card');
        const avatarContainer = document.getElementById('avatarContainer');

        const noTexts = ["Are you sure?", "Really sure?", "Think again!", "Last chance!", "Surely not?", "You might regret this!"];
        let noCount = 0;
        let yesScale = 1;
        let noScale = 1;

        noBtn.addEventListener('click', () => {
            if (noCount < noTexts.length) {
                noBtn.innerText = noTexts[noCount];
                noCount++;

                // Yes ကို တဖြည်းဖြည်း ကြီးအောင်လုပ်မယ်
                yesScale += 0.35;
                yesBtn.style.transform = `scale(${yesScale})`;

                // No ကို သေးအောင်လုပ်မယ်
                noScale -= 0.1;
                noBtn.style.transform = `scale(${noScale})`;
            } else {
                noBtn.style.display = 'none';
                yesScale += 1.5;
                yesBtn.style.transform = `scale(${yesScale})`;
            }
        });

        // Yes နှိပ်ရင် အောင်မြင်သွားတဲ့အဆင့်
        yesBtn.addEventListener('click', () => {
            card.innerHTML = `
                <h1 style="color: #e84118; font-size: 2.2rem; margin-bottom: 15px;">I knew it! ❤️</h1>
                <div class="avatar-box">
                    <svg viewBox="0 0 100 100" width="100%" height="100%">
                        <circle cx="50" cy="45" r="30" fill="#fff" stroke="#333" stroke-width="2.5"/>
                        <circle cx="28" cy="55" r="5" fill="#ffb6c1"/>
                        <circle cx="72" cy="55" r="5" fill="#ffb6c1"/>
                        <path d="M 30,46 Q 35,51 40,46" fill="none" stroke="#333" stroke-width="3" stroke-linecap="round"/>
                        <path d="M 60,46 Q 65,51 70,46" fill="none" stroke="#333" stroke-width="3" stroke-linecap="round"/>
                        <path d="M 50,52 C 50,52 44,44 44,39 C 44,35 47,33 50,36 C 53,33 56,35 56,39 C 56,44 50,52 50,52 Z" fill="#e84118" stroke="#333" stroke-width="1.5" transform="translate(0, 15) scale(1.2) translate(0, -10)"/>
                    </svg>
                </div>
                <p style="font-size: 1.1rem; color: #666; font-weight: bold;">You made the right choice!</p>
            `;
            document.body.style.backgroundColor = "#ffffff";
        });
    </script>

</body>
</html>
